services:
  web:
    build: .
    ports:
      - "8080:5000"
    environment:
      DB_PATH: /data/votes.db
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    volumes:
      - vote_data:/data
    restart: unless-stopped
volumes:
  vote_data:
