{% extends 'base.html' %}{% block title %}공연 투표{% endblock %}{% block content %}<div class="page-head"><span class="eyebrow">YOUR CHOICE</span><h1>공연 투표</h1><p>좋아하는 공연을 검색하고 한 표를 남겨주세요.</p></div>
<div class="card"><form class="inline-form" method="get"><input name="q" value="{{ q }}" placeholder="공연 이름 검색" maxlength="50"><button>검색</button><a class="btn outline" href="{{ url_for('vote') }}">전체 보기</a></form></div>
<div class="card"><h2>공연 선택</h2>{% if already_voted %}<p class="hint">이 브라우저에서는 이미 투표했습니다. 결과는 계속 확인할 수 있습니다.</p>{% endif %}<form method="post" action="{{ url_for('vote') }}">{% for item in votes %}<label class="choice"><input type="radio" name="vote_id" value="{{ item.id }}" required {% if already_voted %}disabled{% endif %}><span><b>{{ item.name }}</b><small>{{ item.description or '공연 소개가 준비 중입니다.' }}</small></span><a href="{{ url_for('detail', vote_id=item.id) }}" onclick="event.stopPropagation()">상세 보기</a></label>{% else %}<p>검색 결과가 없습니다.</p>{% endfor %}<button {% if already_voted or not votes %}disabled{% endif %}>{{ '투표 완료' if already_voted else '선택한 공연에 투표하기' }}</button></form></div>{% endblock %}
