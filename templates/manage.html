{% extends 'base.html' %}{% block title %}공연 관리{% endblock %}{% block content %}<div class="page-head"><span class="eyebrow">PERFORMANCE MANAGEMENT</span><h1>공연 관리</h1><p>공연 추가는 누구나 가능하며, 수정과 삭제는 관리자 비밀번호가 필요합니다.</p></div><div class="card"><h2>새 공연 추가</h2><form method="post" action="{{ url_for('add') }}" class="stack-form"><label>공연 이름<input name="name" maxlength="50" required placeholder="예: 어쿠스틱 공연"></label><label>공연 소개<textarea name="description" maxlength="500" placeholder="공연을 소개해 주세요 (선택)"></textarea></label><button>공연 추가</button></form></div>
<div class="card"><h2>공연 정보 수정 및 삭제</h2>{% for item in votes %}<div class="manage-item"><h3>{{ item.name }} <small>· {{ item.count }}표</small></h3><form method="post" action="{{ url_for('edit', vote_id=item.id) }}" class="stack-form"><label>공연 이름<input name="name" value="{{ item.name }}" maxlength="50" required></label><label>공연 소개<textarea name="description" maxlength="500">{{ item.description }}</textarea></label><label>관리자 비밀번호<input type="password" name="admin_password" required></label><button>정보 수정</button></form><form method="post" action="{{ url_for('delete') }}" class="inline-form delete-line"><input type="hidden" name="vote_id" value="{{ item.id }}"><input type="password" name="admin_password" required placeholder="관리자 비밀번호"><button class="danger" onclick="return confirm('공연과 관련 응원 글이 삭제됩니다. 계속할까요?')">공연 삭제</button></form></div>{% else %}<p>등록된 공연이 없습니다.</p>{% endfor %}</div>{% endblock %}
